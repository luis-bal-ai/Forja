<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f14">
<meta name="description" content="Forja: tus entrenos, hábitos y finanzas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Forja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app de una columna en móvil (nav inferior), dos columnas en escritorio; oscuro deliberado, acento naranja "tiza de gimnasio" */
:root{
  --bg:#0c0f14; --surface:#141921; --surface-2:#1b222c; --surface-3:#242d39; --line:#2a3442;
  --fg:#eef1f5; --muted:#8b97a8; --accent:#ff6b35; --accent-ink:#1a0d06;
  --ok:#3fd69a; --warn:#f4b941; --bad:#ff4d6d;
  --display:"Archivo",system-ui,sans-serif; --body:"Archivo",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-stretch:100%;font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,44px);font-stretch:125%;font-weight:850;letter-spacing:-.01em;line-height:1.02}
h2{font-size:20px;font-stretch:115%;font-weight:800}
h3{font-size:15px;font-weight:700}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:22px;padding-bottom:18px}
.brand{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:13px;letter-spacing:.2em;color:var(--accent)}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.nav-in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:560px}
.nav button{background:none;border:0;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--fg);background:var(--surface-2)}
.nav button[aria-current="true"] svg{color:var(--accent)}
@media (min-width:860px){
  body{padding-bottom:40px}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));}
  .nav button{flex-direction:row;justify-content:center;gap:8px;font-size:13px}
  .nav button svg{width:18px;height:18px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
}

/* cards & grid */
.grid{display:grid;gap:14px}
@media (min-width:860px){.g2{grid-template-columns:1.15fr .85fr}.g3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:750;background:var(--accent);color:var(--accent-ink);font-stretch:110%}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.danger{background:color-mix(in srgb,var(--bad) 18%,var(--surface-2));color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.p-acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.sample{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:3px 9px}

/* hero recommendation */
.hero{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 55%),var(--surface);}
.big{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(26px,5vw,36px);line-height:1}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.stat{min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:clamp(14px,4.4vw,20px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface-2);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.day.today{outline:1px solid var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--surface-3)}
.t-gym{background:var(--accent)} .t-padel{background:#59b8ff} .t-run{background:#c48bff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* body map */
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bodymap svg{width:100%;height:auto;max-height:340px;display:block}
.bodymap .side{font-size:11px;text-align:center;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.mus{cursor:pointer;stroke:var(--bg);stroke-width:1.5;transition:fill-opacity .2s}
.mus:hover{stroke:var(--muted)}
.mus.sel{stroke:var(--fg);stroke-width:2}
.base{fill:var(--surface-3)}
.mdetail{background:var(--surface-2);border-radius:16px;padding:14px;display:grid;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}

/* volume */
.vol{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.vtrack{position:relative;height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.vband{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 14%,transparent);border-left:1px dashed color-mix(in srgb,var(--ok) 60%,transparent);border-right:1px dashed color-mix(in srgb,var(--ok) 60%,transparent)}
.vfill{position:absolute;left:0;top:2px;bottom:2px;border-radius:99px;background:var(--accent)}

/* heat calendar */
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:2px}
.cal i{width:14px;height:14px;border-radius:4px;background:var(--surface-2);display:block}

/* history */
.sess{background:var(--surface-2);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.sess-h{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%}
.sess-h .tdot{width:10px;height:10px;border-radius:50%;flex:none}
.sess-h .t{flex:1;min-width:0}
.sess-h .t b{display:block;font-weight:700}
.exl{font-size:13px;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.exl div{display:flex;justify-content:space-between;gap:10px}

/* chart */
.chart svg{width:100%;height:auto;display:block}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:8px 10px;max-width:100%}

/* habits */
.habit{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:16px;padding:12px 14px}
.check{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:none;display:grid;place-items:center}
.check svg{width:20px;height:20px;opacity:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check[aria-pressed="true"] svg{opacity:1}
.hdots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.hdots i{width:9px;height:9px;border-radius:3px;background:var(--surface-3)}
.hdots i.on{background:var(--accent)}
.streak{text-align:right}
.streak b{font-family:var(--mono);font-size:22px;display:block;line-height:1}
.streak small{font-size:11px;color:var(--muted)}

/* meals */
.rings{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.ring{display:flex;gap:12px;align-items:center}
.meal{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}
@media (max-width:520px){.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}}
input[type=text],input[type=number],input[type=password],input[type=email]{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;min-width:0}

/* finance */
.fin-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.fin-row:last-child{border-bottom:0}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.66);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:860px){.scrim{align-items:center}.sheet{border-radius:24px}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.exlib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:200px;overflow:auto}
.exlib button{text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px;font-weight:600}
.exlib .newex{border:1px dashed var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface-2))}
.excard{background:var(--surface-2);border-radius:16px;padding:12px;display:grid;gap:8px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 30px;gap:8px;align-items:center}
.setrow input{padding:8px 10px;text-align:center}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1}
.field{display:grid;gap:6px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timer{font-family:var(--mono)}
/* finanzas */
.qcard{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.q{display:grid;gap:12px}
.qname{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:19px;overflow-wrap:anywhere}
.qamt{font-size:20px;font-weight:600;white-space:nowrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.fopt{display:flex;align-items:center;gap:8px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px;font-weight:600}
.fopt i,.fcat i{width:9px;height:9px;border-radius:3px;flex:none;background:var(--muted)}
.fopt:hover{border-color:var(--muted)}
.fopt.on{border-color:var(--fg)}
.fcat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 4px;font-size:14px;text-align:left;border-radius:0}
.frow:last-child{border-bottom:0}
.frow.on{background:var(--surface-2);border-radius:10px}
.chev{color:var(--muted);font-size:11px;width:10px;text-align:center}
.catpays{background:var(--surface-2);border-radius:12px;margin:4px 0 8px;padding:4px 10px;display:grid}
.cprow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;text-align:left;width:100%;font-size:13px}
.cprow:hover b{text-decoration:underline}
.cpname{min-width:0;display:grid}.cpname b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cpname small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpfoot{font-size:11px;padding:8px 0 6px}
.ins{background:var(--surface-2);border-radius:14px;padding:11px 13px;display:grid;gap:4px}
.mlist{display:grid}
.mrow{display:grid;grid-template-columns:54px 1fr auto auto;gap:12px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;text-align:left;width:100%}
.mrow:hover{background:var(--surface-2)}
.mname{min-width:0;display:grid}
.mname b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mname small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mamt{text-align:right;white-space:nowrap}
@media (max-width:620px){.mrow{grid-template-columns:44px 1fr auto}.mcat{grid-column:2;grid-row:2}.mamt{grid-row:1/3;grid-column:3}}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--muted)}
.steps b{color:var(--fg)}
label.btn{display:inline-block;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.sync{font-size:11px;color:var(--muted);white-space:nowrap}
.sync[data-s=saving]{color:var(--warn)}.sync[data-s=offline],.sync[data-s=error]{color:var(--bad)}
@media (max-width:420px){.sync[data-s=ok]{display:none}}
.top{padding-top:calc(22px + env(safe-area-inset-top,0px))}
.authwrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:calc(24px + env(safe-area-inset-top,0px)) 24px}
.authcard{width:100%;max-width:400px;display:grid;gap:14px}
.authcard form{display:grid;gap:12px}
.authcard .big{font-size:clamp(30px,8vw,40px)}
.err{color:var(--bad);font-size:14px;margin:0}
.ok{color:var(--ok);font-size:14px;margin:0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0;justify-self:start}
.splash{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="splash" id="splash">Cargando…</div>
<div class="wrap" id="hdr" hidden>
  <header class="top">
    <div>
      <div class="brand">FORJA</div>
      <h1 id="hello">Hola</h1>
      <div class="muted" id="today"></div>
    </div>
    <div class="row" style="gap:10px"><span id="sync" class="sync" data-s="ok">Guardado</span><button class="iconbtn" data-act="profile">Perfil</button></div>
  </header>
</div>
<div id="auth" hidden></div>
<div id="app" hidden>
<nav class="nav" aria-label="Secciones"><div class="nav-in" id="nav"></div></nav>
<main class="wrap" id="view" style="padding-top:16px"></main>
<div id="sheet" hidden></div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- datos base ---------- */
const MUS={pecho:'Pecho',espalda:'Espalda',hombros:'Hombros',trapecio:'Trapecio',biceps:'Bíceps',triceps:'Tríceps',antebrazo:'Antebrazo',abdomen:'Abdomen',lumbar:'Lumbar',gluteos:'Glúteos',cuadriceps:'Cuádriceps',isquios:'Isquios',gemelos:'Gemelos'};
const EX=[
 ['press_banca','Press banca',['pecho'],['triceps','hombros']],
 ['press_incl','Press inclinado mancuernas',['pecho'],['hombros','triceps']],
 ['aperturas','Aperturas en polea',['pecho'],[]],
 ['fondos','Fondos',['triceps'],['pecho','hombros']],
 ['dominadas','Dominadas',['espalda'],['biceps','antebrazo']],
 ['remo_barra','Remo con barra',['espalda'],['biceps','lumbar','trapecio']],
 ['jalon','Jalón al pecho',['espalda'],['biceps']],
 ['remo_polea','Remo en polea baja',['espalda'],['biceps']],
 ['peso_muerto','Peso muerto',['lumbar','isquios','gluteos'],['espalda','trapecio','antebrazo']],
 ['sentadilla','Sentadilla',['cuadriceps','gluteos'],['lumbar','isquios']],
 ['prensa','Prensa',['cuadriceps'],['gluteos']],
 ['hip_thrust','Hip thrust',['gluteos'],['isquios']],
 ['curl_fem','Curl femoral',['isquios'],[]],
 ['ext_cuad','Extensión de cuádriceps',['cuadriceps'],[]],
 ['gemelo','Elevación de gemelos',['gemelos'],[]],
 ['press_mil','Press militar',['hombros'],['triceps']],
 ['elev_lat','Elevaciones laterales',['hombros'],[]],
 ['face_pull','Face pull',['hombros'],['trapecio']],
 ['encog','Encogimientos',['trapecio'],[]],
 ['curl_barra','Curl con barra',['biceps'],['antebrazo']],
 ['curl_mart','Curl martillo',['biceps','antebrazo'],[]],
 ['press_fr','Press francés',['triceps'],[]],
 ['tri_polea','Tríceps en polea',['triceps'],[]],
 ['plancha','Plancha',['abdomen'],[]],
 ['crunch','Crunch en polea',['abdomen'],[]],
 ['rueda','Rueda abdominal',['abdomen'],['lumbar']],
].map(([id,name,p,s])=>({id,name,p,s}));
const EXM=Object.fromEntries(EX.map(e=>[e.id,e]));
const TYPES={gym:{n:'Gimnasio',c:'t-gym',col:'var(--accent)'},padel:{n:'Pádel',c:'t-padel',col:'#59b8ff'},run:{n:'Correr',c:'t-run',col:'#c48bff'}};
const SPLITS=[['Espalda y bíceps',['espalda','biceps']],['Pecho y tríceps',['pecho','triceps']],['Pierna',['cuadriceps','isquios','gluteos']],['Hombro y core',['hombros','abdomen']]];
const TAU=40, READY=2.8, CAP=8; // horas de vida media aprox., carga "lista", carga = saturado al 100%

const DAY=864e5;
const uid=()=>Math.random().toString(36).slice(2,9);
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function loads(now=Date.now()){
  const L=Object.fromEntries(Object.keys(MUS).map(k=>[k,0]));
  const add=(m,v)=>{L[m]+=v};
  for(const s of S.sessions){
    const h=(now-new Date(s.date))/36e5; if(h<0||h>300)continue;
    const d=Math.exp(-h/TAU);
    if(s.type==='gym')for(const e of s.exercises||[]){const x=EXM[e.exId];if(!x)continue;const n=e.sets.length;x.p.forEach(m=>add(m,n*d));x.s.forEach(m=>add(m,n*.5*d))}
    if(s.type==='padel'){const k=(s.durationMin||60)/60*(s.intensity==='alta'?2.2:1.5)*d;['cuadriceps','gemelos','hombros','antebrazo'].forEach(m=>add(m,k));add('abdomen',k*.5)}
    if(s.type==='run'){const k=(s.km||5)*.45*d;['cuadriceps','gemelos','isquios'].forEach(m=>add(m,k));add('gluteos',k*.5)}
  }
  return L;
}
const pct=l=>Math.min(100,Math.round(l/CAP*100));
const status=p=>p>=70?['Saturado','bad']:p>=35?['Recuperando','warn']:['Listo','ok'];
const hoursToReady=l=>l<=READY?0:Math.ceil(TAU*Math.log(l/READY));
function weekSets(){const L=Object.fromEntries(Object.keys(MUS).map(k=>[k,0]));const now=Date.now();
  for(const s of S.sessions){if(s.type!=='gym'||now-new Date(s.date)>7*DAY)continue;for(const e of s.exercises||[]){const x=EXM[e.exId];if(!x)continue;x.p.forEach(m=>L[m]+=e.sets.length);x.s.forEach(m=>L[m]+=e.sets.length*.5)}}return L}
function recommend(L){return SPLITS.map(([n,ms])=>({n,ms,avg:ms.reduce((a,m)=>a+pct(L[m]),0)/ms.length})).sort((a,b)=>a.avg-b.avg)}
const e1rm=(kg,reps)=>kg*(1+reps/30);
function lastFor(exId){const s=[...S.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).find(s=>s.type==='gym'&&(s.exercises||[]).some(e=>e.exId===exId));if(!s)return null;return s.exercises.find(e=>e.exId===exId)}
function sessSummary(s){if(s.type==='gym'){const n=(s.exercises||[]).reduce((a,e)=>a+e.sets.length,0);const vol=(s.exercises||[]).reduce((a,e)=>a+e.sets.reduce((b,x)=>b+x.reps*x.kg,0),0);return `${(s.exercises||[]).length} ejercicios · ${n} series${vol?` · ${fmt(vol)} kg`:''}`}
  if(s.type==='run'){const p=s.durationMin/s.km;return `${s.km} km · ${s.durationMin} min · ${Math.floor(p)}:${String(Math.round((p%1)*60)).padStart(2,'0')} /km`}
  return `${s.durationMin} min · intensidad ${s.intensity||'media'}`}
function streakOf(done){const set=new Set(done);let d=new Date();if(!set.has(dkey(d)))d=new Date(Date.now()-DAY);let n=0;while(set.has(dkey(d))){n++;d=new Date(d-DAY)}return n}
function trainStreakWeeks(){let n=0;for(let w=0;w<52;w++){const end=Date.now()-w*7*DAY,start=end-7*DAY;const c=S.sessions.filter(s=>{const t=+new Date(s.date);return t>start&&t<=end}).length;if(c>=2)n++;else if(w>0)break}return n}

  <div class="field"><label class="lbl" for="pname">Nombre</label><input type="text" id="pname" value="${esc(S.user.name)}"></div>

  <div class="row" style="flex-wrap:wrap"><button class="btn sm danger" data-act="wipe">${ui.confirm==='wipe'?'Toca otra vez: se borra todo':'Empezar de cero'}</button><button class="btn sm ghost" data-act="reseed">Cargar entrenos de ejemplo</button></div>
  <button class="btn ghost" data-act="logout">Cerrar sesión</button>
  <p class="muted" style="font-size:12px;margin:0">Para instalarla en el móvil: en iPhone, Safari → Compartir → «Añadir a pantalla de inicio». En Android, Chrome → menú ⋮ → «Instalar app».</p></div></div>`;return}
  const d=draft;let inner='';
  if(d.type==='gym'){
    inner=`<div class="field"><label class="lbl" for="dtitle">Nombre</label><input type="text" id="dtitle" value="${esc(d.title)}"></div>
    <div class="chips">${Object.keys(MUS).map(k=>`<button class="chip" aria-pressed="${d.filter===k}" data-act="dfilter" data-m="${k}">${MUS[k]}</button>`).join('')}</div>
    <input type="text" id="exq" value="${esc(d.q||'')}" placeholder="Busca o escribe un ejercicio nuevo" aria-label="Buscar o crear ejercicio" autocomplete="off">
    <div class="exlib">${exlibHTML(d)}</div>
    ${d.exercises.map((e,i)=>{const prev=lastFor(e.exId);return `<div class="excard"><div class="row" style="justify-content:space-between"><b>${EXM[e.exId].name}</b><button class="x" data-act="rmex" data-i="${i}" aria-label="Quitar ejercicio">×</button></div>
      ${prev?`<div class="muted" style="font-size:12px">Última vez: ${prev.sets.map(x=>x.kg?`${x.reps}×${x.kg}`:x.reps).join(' · ')}</div>`:''}
      <div class="setrow lbl"><span>#</span><span>Reps</span><span>Kg</span><span></span></div>
      ${e.sets.map((s,j)=>`<div class="setrow"><span class="num muted">${j+1}</span><input type="number" inputmode="numeric" id="r-${i}-${j}" data-set="${i}-${j}-reps" value="${s.reps}" aria-label="Repeticiones serie ${j+1}"><input type="number" inputmode="decimal" step="0.5" id="k-${i}-${j}" data-set="${i}-${j}-kg" value="${s.kg}" aria-label="Kilos serie ${j+1}"><button class="x" data-act="rmset" data-i="${i}" data-j="${j}" aria-label="Quitar serie">×</button></div>`).join('')}
      <button class="btn sm ghost" data-act="addset" data-i="${i}">+ Serie</button></div>`}).join('')}
    <div class="fields"><div class="field"><label class="lbl" for="ddur">Duración (min)</label><input type="number" id="ddur" data-d="durationMin" value="${d.durationMin}"></div><div class="field"><label class="lbl" for="drpe">Esfuerzo (1–10)</label><input type="number" id="drpe" min="1" max="10" data-d="rpe" value="${d.rpe}"></div></div>`}
  if(d.type==='run')inner=`<div class="fields"><div class="field"><label class="lbl" for="dkm">Kilómetros</label><input type="number" step="0.1" id="dkm" data-d="km" value="${d.km}"></div><div class="field"><label class="lbl" for="drm">Minutos</label><input type="number" id="drm" data-d="runMin" value="${d.runMin}"></div></div><p class="muted" style="margin:0">Carga a cuádriceps, isquios y gemelos según los km.</p>`;
  if(d.type==='padel')inner=`<div class="fields"><div class="field"><label class="lbl" for="dpm">Minutos</label><input type="number" id="dpm" data-d="padelMin" value="${d.padelMin}"></div><div class="field"><label class="lbl">Intensidad</label><div class="chips">${['suave','media','alta'].map(x=>`<button class="chip" aria-pressed="${d.intensity===x}" data-act="dint" data-v="${x}">${x}</button>`).join('')}</div></div></div><p class="muted" style="margin:0">Carga a piernas, hombros y antebrazo según la duración.</p>`;
  el.innerHTML=`<div class="scrim" data-act="closebg"><div class="sheet" role="dialog" aria-label="Nuevo entreno"><div class="row" style="justify-content:space-between"><h2>Nuevo entreno</h2><div class="row">${d.type==='gym'?`<button class="chip timer" data-act="timer">${timerLeft?`Descanso ${timerLeft}s`:'Descanso 90 s'}</button>`:''}<button class="x" data-act="close" aria-label="Cerrar">×</button></div></div>
  <div class="seg">${Object.entries(TYPES).map(([k,t])=>`<button aria-pressed="${d.type===k}" data-act="dtype" data-t="${k}">${t.n}</button>`).join('')}</div>${inner}
  <button class="btn" data-act="savesess">Guardar entreno</button></div></div>`;
}

/* ---------- render ---------- */
function render(){ensureFin();
  document.getElementById('hello').textContent=`Hola, ${S.user.name||'tú'}`;
  document.getElementById('today').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})+(S.example?' · datos de ejemplo':'');
  document.getElementById('nav').innerHTML=TABS.map(([k,n])=>`<button data-act="tab" data-t="${k}" aria-current="${ui.tab===k}">${I[k]}<span>${n}</span></button>`).join('');
  document.getElementById('view').innerHTML=({hoy:vHoy,entreno:vEntreno,habitos:vHabitos,comidas:vComidas,finanzas:vFinanzas})[ui.tab]();
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='closebg'&&ev.target!==b)return;
  if(a!=='delsess'&&a!=='wipe'&&a!=='fdelimp')ui.confirm=null;
  switch(a){
    case'tab':ui.tab=b.dataset.t;try{history.replaceState(null,'','#'+ui.tab)}catch(e){}render();scrollTo(0,0);break;
    case'muscle':ui.muscle=b.dataset.m;render();break;
    case'sess':ui.openSess=ui.openSess===b.dataset.id?null:b.dataset.id;render();break;
    case'delsess':if(ui.confirm===b.dataset.id){S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);ui.confirm=null;save();toast('Entreno borrado')}else ui.confirm=b.dataset.id;render();break;
    case'habit':{const h=S.habits.find(x=>x.id===b.dataset.id);const t=dkey(Date.now());if(h.done.includes(t))h.done=h.done.filter(d=>d!==t);else{h.done.push(t);const s=streakOf(h.done);if(s>1)toast(`Racha de ${s} días`)}save();render();break}
    case'preset':{const p=PRESETS[b.dataset.i];S.meals.push({id:uid(),date:dkey(Date.now()),name:p[0],kcal:p[1],p:p[2]});save();render();break}
    case'delmeal':S.meals=S.meals.filter(m=>m.id!==b.dataset.id);save();render();break;
    case'new':openNew();break;
    case'profile':ui.profile=true;renderSheet();break;
    case'close':case'closebg':draft=null;ui.profile=false;if(ui.finEdit){ui.finEdit=null;render()}renderSheet();break;
    case'dtype':draft.type=b.dataset.t;renderSheet();break;
    case'dfilter':draft.filter=draft.filter===b.dataset.m?null:b.dataset.m;renderSheet();break;
    case'dint':draft.intensity=b.dataset.v;renderSheet();break;
    case'addex':{const prev=lastFor(b.dataset.id);draft.exercises.push({exId:b.dataset.id,sets:prev?prev.sets.map(s=>({...s})):[{reps:10,kg:0},{reps:10,kg:0},{reps:10,kg:0}]});draft.q='';renderSheet();break}
    case'createex':{const name=(draft.q||'').trim();if(!name)break;if(!draft.filter){toast('Elige el músculo principal');break}
      const e={id:'c_'+uid(),name,p:[draft.filter],s:[],custom:true};EX.push(e);EXM[e.id]=e;S.customEx=S.customEx||[];S.customEx.push(e);save();
      draft.exercises.push({exId:e.id,sets:[{reps:10,kg:0},{reps:10,kg:0},{reps:10,kg:0}]});draft.q='';renderSheet();toast('Ejercicio guardado para próximos entrenos');break}
    case'logout':(async()=>{if(dirty)await pushRemote();await sb?.auth.signOut();try{localStorage.removeItem(cacheKey())}catch(e){}location.reload()})();break;
    case'fmonth':ui.finMonth=b.dataset.m;ui.finCat=null;ui.finRev=false;ui.finAll=false;render();break;
    case'frev':ui.finRev=!ui.finRev;ui.finAll=false;render();break;
    case'fcat':ui.finCat=ui.finCat===b.dataset.c?null:(b.dataset.c||null);ui.finAll=false;render();break;
    case'fdelimp':{const id=b.dataset.id;if(ui.confirm!=='imp:'+id){ui.confirm='imp:'+id;render();break}ui.confirm=null;
      const gone=t=>id.startsWith('m:')?(!t.imp&&mon(t)===id.slice(2)):t.imp===id;const before=S.fin.tx.length;S.fin.tx=S.fin.tx.filter(t=>!gone(t));
      S.fin.notes=S.fin.notes.filter(n=>id.startsWith('m:')?!(!n.imp&&n.month===id.slice(2)):n.imp!==id);S.fin.imports=S.fin.imports.filter(i=>i.id!==id);
      ui.finCat=null;ui.finAll=false;save();render();toast(`Extracto borrado · ${before-S.fin.tx.length} movimientos`);break}
    case'fall':ui.finAll=!ui.finAll;render();break;
    case'fedit':ui.finEdit=b.dataset.id;renderSheet();break;
    case'fskip':{const g=reviewGroups();if(g.length){ui.finSkip=(ui.finSkip||[]).filter(k=>k!==g[0][0]);ui.finSkip.push(g[0][0])}render();break}
    case'fans':{const g=S.fin.tx.filter(t=>(ui.finGroup||[]).includes(t.id));if(!g.length)break;const kind=b.dataset.kind,cat=b.dataset.cat||null;
      const rem=document.getElementById('fremember')?.checked,note=(document.getElementById('fnote')?.value||'').trim();
      g.forEach(t=>{t.kind=kind;t.cat=cat;t.auto=false;if(note)t.note=note;else delete t.note});
      let extra=0;if(rem){const k=txKey(g[0]);S.fin.rules[k]={kind,cat};S.fin.tx.forEach(t=>{if(!g.includes(t)&&txKey(t)===k&&(!t.kind||t.auto)){t.kind=kind;t.cat=cat;t.auto=false;extra++}})}
      save();const label=cat&&FCATS[cat]?FCATS[cat][0]:KINDN[kind]||'Ingreso';ui.finEdit=null;renderSheet();render();toast(`${label}${g.length+extra>1?` · ${g.length+extra} movimientos`:''}${rem?' · lo recordaré':''}`);break}
    case'rmex':draft.exercises.splice(+b.dataset.i,1);renderSheet();break;
    case'addset':{const e=draft.exercises[+b.dataset.i];const l=e.sets[e.sets.length-1]||{reps:10,kg:0};e.sets.push({...l});renderSheet();break}
    case'rmset':draft.exercises[+b.dataset.i].sets.splice(+b.dataset.j,1);renderSheet();break;
    case'timer':timerLeft=90;clearInterval(timer);timer=setInterval(()=>{timerLeft--;const t=document.querySelector('.timer');if(t)t.textContent=timerLeft>0?`Descanso ${timerLeft}s`:'Descanso 90 s';if(timerLeft<=0){clearInterval(timer);toast('A por la siguiente serie')}},1000);renderSheet();break;
    case'savesess':{const d=draft;let s={id:uid(),date:new Date().toISOString(),type:d.type};
      if(d.type==='gym'){const ex=d.exercises.map(e=>({exId:e.exId,sets:e.sets.filter(x=>x.reps>0)})).filter(e=>e.sets.length);if(!ex.length){toast('Añade al menos un ejercicio');break}Object.assign(s,{title:d.title||'Gimnasio',exercises:ex,durationMin:+d.durationMin||60,rpe:+d.rpe||7})}
      if(d.type==='run')Object.assign(s,{title:'Carrera',km:+d.km||0,durationMin:+d.runMin||0});
      if(d.type==='padel')Object.assign(s,{title:'Pádel',durationMin:+d.padelMin||60,intensity:d.intensity});
      S.sessions.push(s);save();draft=null;renderSheet();ui.tab='entreno';render();toast('Entreno guardado');break}
    case'saveprofile':S.user.name=document.getElementById('pname').value.trim()||'tú';save();ui.profile=false;renderSheet();render();toast('Perfil guardado');break;
    case'wipe':if(ui.confirm==='wipe'){const name=S.user.name;S={v:1,example:false,user:{name},customEx:S.customEx||[],fin:{},sessions:[],habits:[{id:uid(),name:'Entrenar',done:[]},{id:uid(),name:'Beber 2 litros de agua',done:[]},{id:uid(),name:'Leer 20 minutos',done:[]}],meals:[]};ui.confirm=null;ui.profile=false;save();renderSheet();render();toast('Todo listo para empezar')}else{ui.confirm='wipe';renderSheet()}break;
    case'reseed':{const ce=S.customEx||[],fi=S.fin,us=S.user;S=seed();S.customEx=ce;S.fin=fi;S.user=us}save();ui.profile=false;renderSheet();render();toast('Datos de ejemplo cargados');break;
  }
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('label[for=ffile]')){ev.preventDefault();document.getElementById('ffile')?.click();return}if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.mus')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(ev.key==='Escape'&&(draft||ui.profile||ui.finEdit)){draft=null;ui.profile=false;if(ui.finEdit){ui.finEdit=null;render()}renderSheet()}});
document.addEventListener('input',ev=>{const t=ev.target;if(!draft)return;
  if(t.id==='exq'){draft.q=t.value;const l=document.querySelector('.exlib');if(l)l.innerHTML=exlibHTML(draft);return}
  if(t.dataset.set){const[i,j,f]=t.dataset.set.split('-');draft.exercises[i].sets[j][f]=+t.value}
  else if(t.dataset.d)draft[t.dataset.d]=t.value;else if(t.id==='dtitle')draft.title=t.value});
document.addEventListener('change',async ev=>{if(ev.target.id==='exsel'){ui.exChart=ev.target.value;render()}
  if(ev.target.id==='ffile'){const f=ev.target.files&&ev.target.files[0];if(!f)return;ui.finBusy=true;ui.finErr='';render();
    try{const r=await importFile(f);ui.finBusy=false;ui.finCat=null;render();const p=reviewGroups().length;toast(r.added?`${r.added} movimientos importados${p?` · ${p} preguntas`:''}`:'Ese extracto ya estaba importado')}
    catch(e){ui.finBusy=false;ui.finErr=e.message||'No he podido leer el archivo.';render()}}});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target.dataset.form;
  if(f==='habit'){const v=document.getElementById('newhabit').value.trim();if(v){S.habits.push({id:uid(),name:v,done:[]});save();render()}}
  if(f==='meal'){const n=document.getElementById('mname').value.trim(),k=+document.getElementById('mkcal').value,p=+document.getElementById('mprot').value||0;if(n&&k){S.meals.push({id:uid(),date:dkey(Date.now()),name:n,kcal:k,p});save();render()}}});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t)){ui.tab=t;render()}});
/* ---------- acceso ---------- */
const AERR=m=>{m=String(m||'');if(/Invalid login/i.test(m))return'Email o contraseña incorrectos.';if(/not confirmed/i.test(m))return'Antes de entrar, confirma tu email con el enlace que te enviamos.';if(/already registered|already exists/i.test(m))return'Ya hay una cuenta con ese email. Entra con tu contraseña.';if(/at least 6|Password should/i.test(m))return'La contraseña tiene que tener al menos 6 caracteres.';if(/rate limit|too many/i.test(m))return'Demasiados intentos. Espera un minuto y vuelve a probar.';if(/invalid.*email|email.*invalid/i.test(m))return'Ese email no parece válido.';if(/fetch|network/i.test(m))return'No hay conexión. Revisa internet y vuelve a probar.';return m};
const au={mode:'login',err:'',msg:'',busy:false};
function renderAuth(){document.getElementById('splash')?.remove();const el=document.getElementById('auth');el.hidden=false;document.getElementById('app').hidden=true;document.getElementById('hdr').hidden=true;
  const m=au.mode;const title={login:'Entra en tu Forja',signup:'Crea tu cuenta',reset:'Recupera tu contraseña',newpass:'Elige una contraseña nueva'}[m];
  el.innerHTML=`<div class="authwrap"><div class="authcard"><div class="brand">FORJA</div><div class="big">${title}</div>
  <p class="muted" style="margin:0">${m==='signup'?'Entrenos, hábitos y finanzas en un sitio. Tus datos son solo tuyos y se sincronizan entre el móvil y el PC.':m==='reset'?'Te mandamos un enlace para poner una contraseña nueva.':m==='newpass'?'Escribe la contraseña nueva para tu cuenta.':'Tus entrenos, hábitos y finanzas, en el móvil y en el PC.'}</p>
  ${m==='login'||m==='signup'?`<div class="seg" style="grid-template-columns:1fr 1fr"><button aria-pressed="${m==='login'}" data-am="login">Entrar</button><button aria-pressed="${m==='signup'}" data-am="signup">Crear cuenta</button></div>`:''}
  <form id="aform" novalidate>
    ${m==='signup'?`<div class="field"><label class="lbl" for="aname">Tu nombre</label><input type="text" id="aname" autocomplete="given-name" value="${esc(au.name||'')}" required></div>`:''}
    ${m!=='newpass'?`<div class="field"><label class="lbl" for="aemail">Email</label><input type="text" inputmode="email" id="aemail" autocomplete="email" value="${esc(au.email||'')}" required></div>`:''}
    ${m!=='reset'?`<div class="field"><label class="lbl" for="apass">Contraseña</label><input type="password" id="apass" autocomplete="${m==='login'?'current-password':'new-password'}" minlength="6" required></div>`:''}
    ${au.err?`<p class="err" role="alert">${esc(au.err)}</p>`:''}${au.msg?`<p class="ok" role="status">${esc(au.msg)}</p>`:''}
    <button class="btn" ${au.busy?'disabled':''}>${au.busy?'Un momento…':{login:'Entrar',signup:'Crear cuenta',reset:'Enviar enlace',newpass:'Guardar contraseña'}[m]}</button>
  </form>
  ${m==='login'?`<button class="linkbtn" data-am="reset">He olvidado mi contraseña</button>`:m==='reset'?`<button class="linkbtn" data-am="login">Volver a entrar</button>`:''}
  </div></div>`;
  if(!sb){au.err='No se ha podido cargar el servicio de cuentas. Revisa la conexión y recarga.';}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-am]');if(!b)return;const e=document.getElementById('aemail');if(e&&e.value)au.email=e.value.trim();au.mode=b.dataset.am;au.err='';au.msg='';renderAuth()});
document.addEventListener('submit',async ev=>{if(ev.target.id!=='aform')return;ev.preventDefault();ev.stopImmediatePropagation();if(!sb||au.busy)return;
  const v=id=>(document.getElementById(id)?.value||'').trim();const email=v('aemail'),pass=document.getElementById('apass')?.value||'',name=v('aname');if(email)au.email=email;if(name)au.name=name;
  if(au.mode!=='newpass'&&!/^\S+@\S+\.\S+$/.test(email)){au.err='Escribe un email válido.';renderAuth();return}
  if((au.mode==='signup'||au.mode==='newpass'||au.mode==='login')&&pass.length<6){au.err='La contraseña tiene que tener al menos 6 caracteres.';renderAuth();return}
  if(au.mode==='signup'&&!name){au.err='Pon tu nombre.';renderAuth();return}
  au.busy=true;au.err='';au.msg='';renderAuth();const redirect=location.origin+location.pathname;
  try{
    if(au.mode==='login'){const{error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error}
    if(au.mode==='signup'){const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name},emailRedirectTo:redirect}});if(error)throw error;
      if(!data.session){au.mode='login';au.msg=`Te hemos enviado un email a ${email}. Ábrelo, confirma la cuenta y vuelve aquí para entrar.`}}
    if(au.mode==='reset'){const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(error)throw error;au.msg='Si hay una cuenta con ese email, te llegará un enlace en un minuto.'}
    if(au.mode==='newpass'){const{error}=await sb.auth.updateUser({password:pass});if(error)throw error;au.mode='login';toast('Contraseña cambiada');await startApp((await sb.auth.getSession()).data.session);au.busy=false;return}
  }catch(e){au.err=AERR(e.message)}
  au.busy=false;if(!ME)renderAuth();
},true);
let started=false;
async function startApp(session){if(!session){ME=null;started=false;renderAuth();return}if(started&&ME?.id===session.user.id)return;ME=session.user;started=true;document.getElementById('splash')?.remove();
  let cached=null;try{cached=JSON.parse(localStorage.getItem(cacheKey()))}catch(e){}
  applyState(cached);
  document.getElementById('auth').hidden=true;document.getElementById('app').hidden=false;document.getElementById('hdr').hidden=false;render();
  try{const r=await pullRemote();if(r===null){if(!cached){applyState(null)}S._ts=S._ts||Date.now();dirty=true;await pushRemote()}else if(r)render();if(cached&&dirty===false&&cached._ts&&r===false){dirty=true;pushRemote()}setSync(dirty?'saving':'ok')}
  catch(e){console.error(e);setSync(navigator.onLine?'error':'offline')}}
async function boot(){if(!sb){renderAuth();return}
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){au.mode='newpass';au.err='';au.msg='';ME=null;started=false;renderAuth();return}if(ev==='SIGNED_OUT'){ME=null;started=false;renderAuth();return}if(au.mode!=='newpass')setTimeout(()=>startApp(session),0)});
  const{data}=await sb.auth.getSession();if(au.mode!=='newpass')startApp(data.session);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});}
boot();
</script>
